{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center text-center">
    <div class="max-w-md p-8 bg-white rounded-xl shadow-sm border border-slate-200">
        <h1 class="text-6xl font-extrabold text-brand-600 mb-2">404</h1>
        <h2 class="text-xl font-bold text-slate-800 mb-2">Page Not Found</h2>
        <p class="text-slate-600 text-sm mb-6">The page or resource you requested could not be found.</p>
        <a href="/" class="inline-flex items-center px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition">
            Return to Queue
        </a>
    </div>
</div>
{% endblock %}
