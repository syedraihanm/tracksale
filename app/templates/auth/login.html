{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-md border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-800">{{ shop_name|default("Repair Shop") }}</h1>
            <p class="text-xs text-slate-500 mt-1">Enter your Shop PIN to sign in</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <input type="hidden" name="next" value="{{ next_url|default('/') }}">

            <div>
                <label for="pin" class="block text-sm font-medium text-slate-700">Shop PIN</label>
                <input type="password"
                       id="pin"
                       name="pin"
                       required
                       autofocus
                       inputmode="numeric"
                       autocomplete="current-password"
                       placeholder="Example: 1234"
                       class="mt-1 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:outline-none focus:ring-brand-500 focus:border-brand-500 text-sm">
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-sm shadow transition focus:outline-none focus:ring-2 focus:ring-brand-500">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
